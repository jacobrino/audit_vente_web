{% extends 'base.html' %}
{% block title %}Supprimer client{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Supprimer un client</h4>
            </div>
            <div class="card-body">
                <p>Voulez-vous vraiment supprimer le client <strong>{{ client.nom }}</strong> ?</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'client_list' %}" class="btn btn-secondary">Annuler</a>
                        <button type="submit" class="btn btn-danger">
                            <i class="fa-solid fa-trash"></i> Supprimer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
